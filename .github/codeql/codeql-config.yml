# CodeQL configuration, shared by both jobs in .github/workflows/codeql.yml.
#
# The only job this file has is keeping SwiftPM's dependency checkout out of the results.
#
# `Integrations/KelvinPerceptionMLX/.build/` is gitignored and untracked, but it is on disk by the
# time CodeQL runs, because resolving the package graph is what puts it there. Everything under
# `checkouts/` is someone else's source. swift-huggingface in particular arrives transitively via
# MLX and Kelvin never calls it — the perception model is bundled and a release downloads nothing —
# yet its Hub cache builds local paths out of server-supplied repo IDs and filenames, which is a
# real path-traversal shape and produced eleven high-severity alerts against code this project does
# not ship a call site for. That noise is the entire reason this file exists.
#
# MEASURED, NOT SUSPECTED: `paths-ignore` does nothing for the swift job. GitHub documents it as
# applying to interpreted languages and to compiled languages analysed *without* building; Swift is
# compiled and has no `build-mode: none`, so the rule that governs is "CodeQL analyses whatever your
# build steps build". The first run under this config (0863f77) returned results=12 for
# /language:swift — byte-identical to the default-setup run it replaced, dependency findings and
# all. Do not read the filter below as load-bearing for Swift, and do not spend an afternoon
# wondering why it is not working. It works for the `actions` job and nowhere else.
#
# It is kept anyway because it costs nothing, it is correct for `actions`, and the fallback is
# cheap: dismiss the alerts once and CodeQL remembers by fingerprint across scans. The residual
# annoyance is that a dependency bump gives the findings new fingerprints and they return.
#
# The lever that WOULD work is the build step rather than this file: compile the dependency graph
# before `codeql init` starts tracing, so only first-party modules recompile under tracing and only
# they get extracted. Considered and rejected on 27 July 2026. It leans on SwiftPM's incremental
# build behaviour, and when that drifts the traced build compiles nothing, the extractor sees
# nothing, and the job goes green having analysed zero lines — the same silent-success failure the
# cache step in codeql.yml is written to avoid. A noisy scanner is visibly noisy; a scanner that is
# quietly off is not. Dismissing a few alerts a year is the cheaper of the two.
#
# Worth remembering before deciding this scanning is pure waste: the Hub client is unreachable
# because the model is bundled. If Kelvin ever stops bundling weights and calls a download API, that
# path-traversal shape becomes live first-party-adjacent code, already under watch.

name: "Kelvin CodeQL"

paths-ignore:
  - "**/.build/**"
  - "Integrations/KelvinPerceptionMLX/.build/**"
